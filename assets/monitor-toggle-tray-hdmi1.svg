<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Monitor Toggle HDMI 1 tray icon</title>
  <desc id="desc">A modern monitor icon with a teal HDMI 1 badge.</desc>
  <defs>
    <linearGradient id="shell" x1="52" y1="46" x2="204" y2="186" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screen" x1="66" y1="60" x2="196" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b3b47"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="accent" x1="84" y1="118" x2="182" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="badge" x1="164" y1="152" x2="224" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="48" y="48" width="160" height="104" rx="28" fill="url(#shell)"/>
    <rect x="60" y="60" width="136" height="80" rx="20" fill="url(#screen)"/>
    <rect x="74" y="74" width="82" height="8" rx="4" fill="#94a3b8" opacity="0.95"/>
    <rect x="84" y="104" width="96" height="12" rx="6" fill="url(#accent)"/>
    <rect x="118" y="150" width="20" height="28" rx="10" fill="#334155"/>
    <rect x="90" y="176" width="76" height="12" rx="6" fill="#64748b"/>
  </g>

  <g transform="translate(156 142)" filter="url(#shadow)">
    <circle cx="36" cy="36" r="32" fill="#f8fafc"/>
    <circle cx="36" cy="36" r="25" fill="url(#badge)"/>
    <path d="M36 19v34" stroke="#042f2e" stroke-width="10" stroke-linecap="round"/>
    <path d="M28 28l8-8 8 8" fill="none" stroke="#042f2e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

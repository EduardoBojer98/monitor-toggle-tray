<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Monitor Toggle HDMI 2 tray icon</title>
  <desc id="desc">A modern monitor icon with an orange HDMI 2 badge.</desc>
  <defs>
    <linearGradient id="shell" x1="52" y1="46" x2="204" y2="186" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screen" x1="66" y1="60" x2="196" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a1d31"/>
      <stop offset="1" stop-color="#3b1625"/>
    </linearGradient>
    <linearGradient id="accentTop" x1="84" y1="96" x2="158" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="accentBottom" x1="84" y1="118" x2="182" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fed7aa"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="badge" x1="164" y1="152" x2="224" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="48" y="48" width="160" height="104" rx="28" fill="url(#shell)"/>
    <rect x="60" y="60" width="136" height="80" rx="20" fill="url(#screen)"/>
    <rect x="74" y="74" width="82" height="8" rx="4" fill="#cbd5e1" opacity="0.95"/>
    <rect x="84" y="92" width="74" height="10" rx="5" fill="url(#accentTop)"/>
    <rect x="84" y="110" width="98" height="12" rx="6" fill="url(#accentBottom)"/>
    <rect x="118" y="150" width="20" height="28" rx="10" fill="#334155"/>
    <rect x="90" y="176" width="76" height="12" rx="6" fill="#64748b"/>
  </g>

  <g transform="translate(156 142)" filter="url(#shadow)">
    <circle cx="36" cy="36" r="32" fill="#fff7ed"/>
    <circle cx="36" cy="36" r="25" fill="url(#badge)"/>
    <path d="M25 28c2-6 8-10 16-10 8 0 14 4 17 10" fill="none" stroke="#4a1d06" stroke-width="8" stroke-linecap="round"/>
    <path d="M54 34c0 7-5 11-12 16-8 5-12 8-14 13h27" fill="none" stroke="#4a1d06" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

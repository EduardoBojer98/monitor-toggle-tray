    <path d="M31 13v32" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
    <path d="M23 21l8-8 8 8" fill="none" stroke="#0f172a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
